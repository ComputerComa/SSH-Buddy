name: build

# Pushes to master and pull requests run the tests and build the bundles.
# Pushing a SemVer tag (vMAJOR.MINOR.PATCH, optionally -prerelease) also publishes a GitHub release.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # agent/go.mod pins the toolchain; GOTOOLCHAIN=auto (the default) fetches it if this go is older.
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if [[ ! "$GITHUB_REF_NAME" =~ $semver ]]; then
              echo "::error::tag '$GITHUB_REF_NAME' is not SemVer; use vMAJOR.MINOR.PATCH, e.g. v1.2.0 or v1.2.0-rc.1"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building version $version"

      - name: Test server
        run: dotnet test

      - name: Test agent
        working-directory: agent
        run: go test -race ./...

      - name: Build bundles
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build.sh
          server="$(dist/ssh-buddy-server-linux-x64/app/SshBuddy.Web version)"
          agent="$(dist/ssh-buddy-server-linux-x64/agent/$VERSION/ssh-buddy-agent-linux-amd64 version)"
          if [[ "$server" != "$VERSION" || "$agent" != "ssh-buddy-agent $VERSION "* ]]; then
            echo "::error::binaries report server '$server', agent '$agent'; expected '$VERSION'"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bundles
          path: dist

      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          sha256sum ssh-buddy-*.tar.gz > SHA256SUMS
          flags=(--verify-tag --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" ssh-buddy-*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" "${flags[@]}"
